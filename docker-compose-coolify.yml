version: "3.8"

services:
  db:
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    container_name: gaia-bpmn-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bpmn_properties}
      POSTGRES_USER: ${POSTGRES_USER:-bpmn_properties}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    volumes:
      - gaia-bpmn-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT 1 FROM processes LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: gaia-bpmn-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db;Database=${POSTGRES_DB:-bpmn_properties};Username=${POSTGRES_USER:-bpmn_properties};Password=${POSTGRES_PASSWORD:-change-me-for-local-use}
      Storage__LocalPath: /app/storage
      Auth__JwtKey: ${AUTH_JWT_KEY:-change-me-gaia-bpmn-local-jwt-secret-key-min-32-chars}
      Auth__JwtIssuer: ${AUTH_JWT_ISSUER:-gaia-bpmn-api}
      Auth__JwtAudience: ${AUTH_JWT_AUDIENCE:-gaia-bpmn-desktop}
      Auth__AdminUsername: ${AUTH_ADMIN_USERNAME:-admin}
      Auth__AdminPassword: ${AUTH_ADMIN_PASSWORD:-admin123}
      Auth__AdminDisplayName: ${AUTH_ADMIN_DISPLAY_NAME:-Administrador}
      Cors__AllowedOrigins__0: ${SERVICE_URL_NGINX:-http://localhost}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_DEV:-http://localhost:5173}
    volumes:
      - gaia-bpmn-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: gaia-bpmn-nginx
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  gaia-bpmn-db:
  gaia-bpmn-storage:
