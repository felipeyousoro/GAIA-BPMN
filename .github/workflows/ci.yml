name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/BpmnProperties.sln
      - run: dotnet build backend/BpmnProperties.sln --no-restore --configuration Release
      - run: dotnet test backend/BpmnProperties.sln --no-build --configuration Release
