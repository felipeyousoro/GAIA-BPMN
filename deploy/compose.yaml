services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB:-bpmn_properties};Username=${POSTGRES_USER:-bpmn_properties};Password=${POSTGRES_PASSWORD:-change-me-for-local-use}
      Storage__ServiceUrl: http://object-storage:9000
      Storage__Bucket: bpmn-properties
      Storage__AccessKey: ${MINIO_ROOT_USER:-minio}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-change-me-for-local-use}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_DEV:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_ELECTRON:-null}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bpmn_properties}
      POSTGRES_USER: ${POSTGRES_USER:-bpmn_properties}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend/src/BpmnProperties.Infrastructure/Migrations/0001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ../backend/src/BpmnProperties.Infrastructure/Migrations/0002_diagrams_io_attachments.sql:/docker-entrypoint-initdb.d/002_diagrams_io_attachments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: rustfs/rustfs:latest
    command: server /data --address ":9000"
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-for-local-use}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
